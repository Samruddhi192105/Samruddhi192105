name: Refresh Profile Assets

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/radar.py \
            --data assets/skills.json \
            -o assets/radar

          python scripts/radar.py \
            --github "${{ github.repository_owner }}" \
            -o assets/radar-langs \
            --limit 7 \
            --curve 0.4 \
            --exclude "Shell,Makefile,Dockerfile"

          python scripts/cards.py \
            --user "${{ github.repository_owner }}" \
            --out assets

          python scripts/repos.py \
            --user "${{ github.repository_owner }}" \
            --out assets/all-repositories.md

          python - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          repositories = Path("assets/all-repositories.md").read_text(
              encoding="utf-8"
          ).strip()

          start_marker = "<!-- ALL_REPOS_START -->"
          end_marker = "<!-- ALL_REPOS_END -->"

          content = readme.read_text(encoding="utf-8")

          if start_marker not in content or end_marker not in content:
              raise RuntimeError(
                  "README.md is missing ALL_REPOS_START or ALL_REPOS_END markers."
              )

          before = content.split(start_marker, 1)[0]
          after = content.split(end_marker, 1)[1]

          updated = (
              before
              + start_marker
              + "\n"
              + repositories
              + "\n"
              + end_marker
              + after
          )

          readme.write_text(updated, encoding="utf-8")

          print("README.md repository section updated successfully.")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh profile assets"
            git push
          fi
