name: Refresh Profile Assets

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/radar.py \
            --data assets/skills.json \
            -o assets/radar

          python scripts/radar.py \
            --github "${{ github.repository_owner }}" \
            -o assets/radar-langs \
            --limit 7 \
            --curve 0.4 \
            --exclude "Shell,Makefile,Dockerfile"

          python scripts/cards.py \
            --user "${{ github.repository_owner }}" \
            --out assets

          python scripts/repos.py \
            --user "${{ github.repository_owner }}" \
            --out assets/all-repositories.md

          python - <<'PY'
          from pathlib import Path

          p = Path("README.md")
          s = p.read_text(encoding="utf-8")
          r = Path("assets/all-repositories.md").read_text(
              encoding="utf-8"
          ).strip()

          a = "<!-- ALL_REPOS_START -->"
          b = "<!-- ALL_REPOS_END -->"

          if a in s and b in s:
              before = s.split(a, 1)[0]
              after = s.split(b, 1)[1]

              s = (
                  before
                  + a
                  + "\n"
                  + r
                  + "\n"
                  + b
                  + after
              )

              p.write_text(s, encoding="utf-8")
          else:
              print("README markers not found; README was not modified.")
          PY

      - name: Commit updated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh profile assets"
            git push
          fi
